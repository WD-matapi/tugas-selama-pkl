name: Setup Labels
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'absensi', color: '0e8a16', description: 'Absensi mingguan siswa' },
              { name: 'terverifikasi', color: '1d76db', description: 'Absensi diverifikasi guru' },
              { name: 'ditolak', color: 'b60205', description: 'Absensi ditolak / bukti tidak valid' },
              { name: 'tanya-guru', color: 'fbca04', description: 'Pertanyaan/kendala siswa' },
              { name: 'terjawab', color: '5319e7', description: 'Pertanyaan sudah terjawab' },
            ];
            for (const l of labels) {
              try {
                await github.rest.issues.createLabel({ ...context.repo, ...l });
              } catch (e) {
                if (e.status === 422) {
                  await github.rest.issues.updateLabel({ ...context.repo, ...l });
                } else { throw e; }
              }
            }
